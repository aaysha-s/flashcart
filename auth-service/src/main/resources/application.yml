server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: flashcart
    password: flashcart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
flashcart:
  jwt:
    secret: ${JWT_SECRET}
    issuer: flashcart-auth
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          probes:
            enabled: true
      metrics:
        tags:
          application: ${spring.application.name}