server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: flashcart
    password: flashcart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
flashcart:
  jwt:
    secret: ${JWT_SECRET}
    issuer: flashcart-auth
    access-token-ttl: 15m
    refresh-token-ttl: 7d
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false