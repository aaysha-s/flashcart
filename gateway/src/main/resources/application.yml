server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**