# ---------- storefront (nginx) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: flashcart
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront }
    spec:
      containers:
        - name: storefront
          image: ghcr.io/aaysha-s/flashcart-storefront:latest
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: storefront, namespace: flashcart }
spec:
  selector: { app: storefront }
  ports: [ { port: 8080, targetPort: 8080 } ]