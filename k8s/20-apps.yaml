# ---------- auth-service ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flashcart
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/aaysha-s/flashcart-auth-service:latest
          ports: [ { containerPort: 8081 } ]
          envFrom:
            - configMapRef: { name: flashcart-config }
            - secretRef: { name: flashcart-secrets }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/auth_db" }
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: flashcart }
spec:
  selector: { app: auth-service }
  ports: [ { port: 8081, targetPort: 8081 } ]
---
