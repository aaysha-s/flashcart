server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: flashcart
    password: flashcart
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

flashcart:
  jwt:
    secret: ${JWT_SECRET}
    issuer: flashcart-auth